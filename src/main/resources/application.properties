spring.application.name=todo-app
spring.datasource.url=jdbc:mysql://localhost:3306/java_db?useSSL=false&serverTimeZone=UTC
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.data.jdb.dialect=mysql


# Hibernate settings
# Hibernate ddl auto (create, create-update, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

logging.level.org.springframework=DEBUG

# Liquibase configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-main.yaml