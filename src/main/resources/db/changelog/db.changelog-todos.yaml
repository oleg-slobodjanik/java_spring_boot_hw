databaseChangeLog:
  - changeSet:
      id: 1
      author: "olegS"
      changes:
        - createTable:
            tableName: "todos"
            columns:
              - column:
                  name: "id"
                  type: "BIGINT"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "title"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "description"
                  type: "VARCHAR(500)"
              - column:
                  name: "due_date"
                  type: "TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "priority"
                  type: "VARCHAR(20)"
              - column:
                  name: "status"
                  type: "VARCHAR(20)"
                  constraints:
                    nullable: false
              - column:
                  name: "created_date"
                  type: "TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_date"
                  type: "TIMESTAMP"
              - column:
                  name: "is_deleted"
                  type: "TINYINT(1)"
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: "user_id"
                  type: "BIGINT"
                  constraints:
                    nullable: false